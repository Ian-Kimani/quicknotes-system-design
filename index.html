<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>QuickNotes</h1>

      <p id="status" role="status" aria-live="polite"></p>

      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a note</h2>
        <form id="note-form">
          <label for="title-input">Title</label>
          <input id="title-input" name="title" type="text" maxlength="100" required>

          <label for="body-input">Body</label>
          <textarea id="body-input" name="body" rows="4"></textarea>

          <button id="submit-btn" type="submit">Create note</button>
        </form>
      </section>

      <section aria-labelledby="notes-heading">
        <div class="notes-header">
          <h2 id="notes-heading">Notes</h2>
          <button id="load-btn" type="button">Load notes</button>
        </div>
        <ul id="notes-list"></ul>
      </section>
    </main>
  </body>
</html>
